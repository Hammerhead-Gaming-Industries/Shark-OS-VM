    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shark OS VM - PIN</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: monospace;
        }
        #menuContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0df, #000);
            z-index: 1;
        }
        #interfacePanel {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px 50px;
            border: 2px solid #0df;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #0df;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
            margin-bottom: 10px;
        }
        /* Secret Click Area Component */
        .subtitle-secret {
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: default; /* Mimics flat plain text */
        }
        .input-field {
            width: 200px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #0df;
            border: 2px solid #0df;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.3);
        }
        .input-field:focus {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(0, 255, 0, 0.3);
        }
        .nav-btn {
            display: block;
            width: 200px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.1);
            color: #0df;
            border: 2px solid #0df;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: #0df;
            color: #000;
            box-shadow: 0 0 15px #0df;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        .error-message {
            color: #ff3333;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            height: 15px;
            visibility: hidden;
        }
    </style>

<body>

<div id="menuContainer">
    <canvas id="backgroundCanvas"></canvas>
    
    <div id="interfacePanel">
        <div>
            <h1>ENTER PIN</h1>
            <!-- Hidden button trigger disguised as clean layout text -->
            <div id="secretTrigger" class="subtitle-secret" onclick="revealAttempts()">---::---</div>
        </div>

        <!-- Password Input -->
        <input type="password" id="passwordInput" class="input-field" maxlength="4" placeholder="••••" autocomplete="off">
        
        <!-- Error Readout -->
        <div id="errorMsg" class="error-message">ACCESS DENIED</div>
     
        <!-- Actions -->
        <button onclick="verifyPassword()" class="nav-btn">Verify</button>
        
    </div>
</div>

<script>

// Persistent tracking utilizing localStorage
let wrongAttempts = localStorage.getItem('failedAttemptsCount') ? parseInt(localStorage.getItem('failedAttemptsCount')) : 0;

function verifyPassword() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('errorMsg');

    if (input.value === '0515') {
        error.style.visibility = 'hidden';
        window.location.href = "desktop.html"; 
    } else {
        wrongAttempts++;
        localStorage.setItem('failedAttemptsCount', wrongAttempts); // Persist tally data
        
        error.innerText = "ACCESS DENIED";
        error.style.visibility = 'visible';
        input.value = ''; 
        input.focus();
    }
}

// Invisible trigger function to dump counts cleanly into terminal window
function revealAttempts() {
    const errorDisplay = document.getElementById('errorMsg');
    errorDisplay.innerText = `FAILED BREACHES: ${wrongAttempts}`;
    errorDisplay.style.visibility = 'visible';
}

function goBack() {
    window.location.href = "index.html"; 
}

document.getElementById('passwordInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        verifyPassword();
    }
});

// Canvas Animation System
const canvas = document.getElementById("backgroundCanvas");
const ctx = canvas.getContext("2d");


function init() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    document.getElementById('passwordInput').focus();
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}


init();
// any reproduction of these works will result in the perpitrator being scalped and having their skull mounted on my bedroom wall. This is not a joke.//
</script>
</body>
