<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Library</title>
  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

<style>
    :root {
      --bg-primary: #121212;
      --bg-surface: #181818;
      --bg-surface-hover: #282828;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --accent-color: #1db954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-header {
      padding: 20px 30px;
      background-color: var(--bg-primary);
      border-bottom: 1px solid #282828;
    }

    .library-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
      padding: 30px;
      overflow-y: auto;
      padding-bottom: 120px;
    }
    .track-card {
      background-color: var(--bg-surface);
      padding: 16px;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .track-card:hover {
      background-color: var(--bg-surface-hover);
      transform: translateY(-4px);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      background-color: #333;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: #181818;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .now-playing {
      display: flex;
      align-items: center;
      width: 30%;
      min-width: 180px;
    }

    .player-cover {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 14px;
      background-color: #333;
    }

    .track-details {
      overflow: hidden;
    }

    .track-title {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playback-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 40%;
      max-width: 700px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s, transform 0.1s;
    }

    .btn:hover {
      color: var(--text-main);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-main {
      font-size: 1.8rem;
      color: var(--text-main);
    }

    .progress-container {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
    }

    .time-stamp {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 30px;
    }

    .slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #535353;
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-main);
      transition: background-color 0.2s;
    }

    .slider:hover::-webkit-slider-thumb {
      background: var(--accent-color);
    }
	.notom-btn {
            background: var(--accent-gradient);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

    
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>Music Library</h1>
    </header>

    <main class="library-grid" id="libraryGrid"></main>

    <footer class="player-bar">
      <audio id="audioEngine" src=""></audio>

      <div class="now-playing">
        <img id="playerCover" src="Images/Logo.jpg" alt="Album Art" class="player-cover">
        <div class="track-details">
          <div id="playerTitle" class="track-title">No Track Selected</div>
          <div id="playerArtist" class="track-artist">Select a song from your library</div>
        </div>
      </div>

      <div class="playback-controls">
        <div class="control-buttons">
          <button id="prevBtn" class="btn">⏮️</button>
          <button id="playBtn" class="btn btn-main">▶</button>
          <button id="nextBtn" class="btn">⏭️</button>
        </div>
        <div class="progress-container">
          <span id="currentTime" class="time-stamp">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" max="100" value="0">
          <span id="durationTime" class="time-stamp">0:00</span>
        </div>
      </div>
	<a href="index.html" class="notom-btn">Tom</a>
    </footer>
  </div>
  <script>
    const audioLibraryData = [
		//Nova Rockafeller
      {
        id: 0,
        title: "Made In Gold",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Made In Gold.m4a", 
        coverUrl: "Images/Made In Gold.jpg"  
      },
      {
        id: 1,
        title: "Jesus On My Neck",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Jesus On My Neck.m4a", 
        coverUrl: "Images/Jesus On My Neck.jpg"  
      },
      {
        id: 2,
        title: "1990s",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/1990s.m4a", 
        coverUrl: "Images/1990s.jpg"  
      },
	{
        id: 3,
        title: "Wishing Well",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Wishing Well.m4a", 
        coverUrl: "Images/Wishing Well.jpg"  
      },
	 {
        id: 4,
        title: "Bike Racks",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Bike Racks.m4a", 
        coverUrl: "Images/Scared Of Heights.jpg"  
      },
      {
        id: 5,
        title: "Lost Girls",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Lost Girls.m4a", 
        coverUrl: "Images/Lost Girls.png"  
      },
	{
        id: 6,
        title: "Insufficient Funds",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/Insufficient Funds.m4a", 
        coverUrl: "Images/Insufficient Funds.png"  
      },
	{
        id: 7,
        title: "PTSD",
        artist: "Nova Rockafeller",
        audioUrl: "Nova Rockafeller/PTSD.m4a", 
        coverUrl: "Images/PTSD.jpg"  
      },
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    const defaultPlaceholderCover = "Logo.jpeg";

    const libraryGrid = document.getElementById("libraryGrid");
    const audioEngine = document.getElementById("audioEngine");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressSlider = document.getElementById("progressSlider");
    const currentTimeLabel = document.getElementById("currentTime");
    const durationTimeLabel = document.getElementById("durationTime");

    const playerCover = document.getElementById("playerCover");
    const playerTitle = document.getElementById("playerTitle");
    const playerArtist = document.getElementById("playerArtist");

    function initAudioLibrary() {
      renderLibrary();
      loadTrack(currentTrackIndex);
      
      playBtn.addEventListener("click", togglePlayback);
      prevBtn.addEventListener("click", handlePreviousTrack);
      nextBtn.addEventListener("click", handleNextTrack);
      audioEngine.addEventListener("timeupdate", updatePlaybackProgress);
      audioEngine.addEventListener("loadeddata", updateTrackDuration);
      audioEngine.addEventListener("ended", handleNextTrack);
      progressSlider.addEventListener("input", seekAudioPosition);
    }

    function renderLibrary() {
      libraryGrid.innerHTML = "";
      audioLibraryData.forEach((track, index) => {
        const card = document.createElement("div");
        card.classList.add("track-card");
        card.addEventListener("click", () => selectAndPlayTrack(index));

        const coverSrc = track.coverUrl || defaultPlaceholderCover;

        card.innerHTML = `
          <img src="${coverSrc}" alt="${track.title}" class="card-cover">
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;
        libraryGrid.appendChild(card);
      });
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = audioLibraryData[currentTrackIndex];

      audioEngine.src = track.audioUrl;
      playerTitle.textContent = track.title;
      playerArtist.textContent = track.artist;
      playerCover.src = track.coverUrl || defaultPlaceholderCover;
      
      progressSlider.value = 0;
      currentTimeLabel.textContent = "0:00";
      durationTimeLabel.textContent = "0:00";
    }

    function selectAndPlayTrack(index) {
      loadTrack(index);
      startPlayback();
    }

    function togglePlayback() {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      if (!audioEngine.src || audioEngine.getAttribute("src") === "") {
        alert(`Format link source mapping missing for item: "${audioLibraryData[currentTrackIndex].title}"`);
        return;
      }
      
      audioEngine.play()
        .then(() => {
          isPlaying = true;
          playBtn.textContent = "||";
        })
        .catch(err => console.error("Playback error encountered:", err));
    }

    function pausePlayback() {
      audioEngine.pause();
      isPlaying = false;
      playBtn.textContent = "▶";
    }

    function handlePreviousTrack() {
      let newIndex = currentTrackIndex - 1;
      if (newIndex < 0) {
        newIndex = audioLibraryData.length - 1;
      }
      loadTrack(newIndex);
      if (isPlaying) startPlayback();
    }

    function handleNextTrack() {
      let newIndex = currentTrackIndex + 1;
      if (newIndex >= audioLibraryData.length) {
        newIndex = 0;
      }
      loadTrack(newIndex);
      if (isPlaying) startPlayback();
    }

    function formatTimeUnits(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updatePlaybackProgress() {
      if (audioEngine.duration) {
        const currentPercentage = (audioEngine.currentTime / audioEngine.duration) * 100;
        progressSlider.value = currentPercentage;
        currentTimeLabel.textContent = formatTimeUnits(audioEngine.currentTime);
      }
    }

    function updateTrackDuration() {
      durationTimeLabel.textContent = formatTimeUnits(audioEngine.duration);
    }

    function seekAudioPosition() {
      if (audioEngine.duration) {
        const targetTime = (progressSlider.value / 100) * audioEngine.duration;
        audioEngine.currentTime = targetTime;
      }
    }

    window.addEventListener("DOMContentLoaded", initAudioLibrary);
  </script>
</body>
</html>
