<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111622;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e6ed;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            color: #ffffff;
        }
        .section {
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00ddff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .setting-row:last-child {
            margin-bottom: 0;
        }
        label {
            font-size: 13px;
            color: #a0aec0;
        }
        input[type="text"] {
            width: 100%;
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 6px;
            padding: 10px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00ddff;
        }
        .toggle-row {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4a5568;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #007aff;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .btn-save {
            background: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>System Settings</h2>
        
        <div class="section">
            <div class="section-title">Wallpapers</div>
            <div class="setting-row">
                <label for="desktop-bg-input">Desktop Background URL</label>
                <input type="text" id="desktop-bg-input" placeholder="e.g. Images/default_background.jpeg">
            </div>
            <div class="setting-row">
                <label for="mobile-bg-input">Mobile Background URL</label>
                <input type="text" id="mobile-bg-input" placeholder="e.g. Images/default_background.jpeg">
            </div>
        </div>

        <div class="section">
            <div class="section-title">System Behavior</div>
            <div class="setting-row toggle-row">
                <label for="time-format-toggle">Use 24-Hour Time Format</label>
                <label class="switch">
                    <input type="checkbox" id="time-format-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row toggle-row">
                <label for="fullscreen-toggle">Forced Fullscreen on App Launch</label>
                <label class="switch">
                    <input type="checkbox" id="fullscreen-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <button class="btn-save" onclick="saveSettings()">Apply Changes</button>
    </div>

    <script>
        function loadSettings() {
            const desktopBg = localStorage.getItem('cfg_desktop_bg') || 'Images/default_background.jpeg';
            const mobileBg = localStorage.getItem('cfg_mobile_bg') || 'Images/default_background.jpeg';
            const use24Hour = localStorage.getItem('cfg_use_24hour') === 'true';
            const forceFullscreen = localStorage.getItem('cfg_force_fullscreen') === 'true';

            document.getElementById('desktop-bg-input').value = desktopBg;
            document.getElementById('mobile-bg-input').value = mobileBg;
            document.getElementById('time-format-toggle').checked = use24Hour;
            document.getElementById('fullscreen-toggle').checked = forceFullscreen;
        }

        function saveSettings() {
            const desktopBg = document.getElementById('desktop-bg-input').value.trim();
            const mobileBg = document.getElementById('mobile-bg-input').value.trim();
            const use24Hour = document.getElementById('time-format-toggle').checked;
            const forceFullscreen = document.getElementById('fullscreen-toggle').checked;

            localStorage.setItem('cfg_desktop_bg', desktopBg);
            localStorage.setItem('cfg_mobile_bg', mobileBg);
            localStorage.setItem('cfg_use_24hour', use24Hour);
            localStorage.setItem('cfg_force_fullscreen', forceFullscreen);

            window.parent.postMessage({ type: 'SHARK_OS_SETTINGS_CHANGED' }, '*');
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
